; Filter hints - server-side
COM_DATAVIEWER_FILTER_HINT_SERVERSIDE="The dropdown list only shows a limited number of available options.\n\nIf you don't see what you want on the list, please enter a filter text in the text box and then press Enter to bring up more results to match your text."
; Filter hints - client-side
COM_DATAVIEWER_FILTER_HINT_CLIENTSIDE="Click on the search box to list all the entries in the column"

; Filter hints - number
COM_DATAVIEWER_FILTER_HINT_NUMBER="Enter a number to filter this column by.\n\nFollowing filter options are also supported,\nRange filtering - ( e.g. 15.7 to 25 )\nLess than, greater than ( e.g. <100 ), (e.g. >25)\nLess than or equal, greater than or equal ( e.g. <=-12.5 ), (e.g. >=0.3)\nEqual, not equal and ignore pattern ( e.g. =-2.55 ), ( e.g. !=-2.55 ), ( e.g. !55 )"

; Filter hints - datetime
COM_DATAVIEWER_FILTER_HINT_DATETIME="Enter a date to filter this column by.\nRange filtering - ( e.g. 2011-01-25 to 2011-03-25 )\nLess than, greater than ( e.g. <2011-03-25 ), (e.g. >2011-01-25)\nLess than or equal, greater than or equal ( e.g. <=2011-03-25 ), (e.g. >=2010-03-25)\nEqual, not equal and ignore pattern ( e.g. =2009-01-17 ), ( e.g. !=2009-01-17 ), ( e.g. !2009-01 )"

; Filter hints - string
COM_DATAVIEWER_FILTER_HINT_STRING="Enter a word or a phrase to filter this column by.\n\nFollowing filter options are also supported,\nExact matches, use '=' ( e.g. =keyword)\nTo ignore a specific word, use '!=' ( e.g. !=keyword)\nTo ignore a pattern, use '!' ( e.g. !keyword )"

