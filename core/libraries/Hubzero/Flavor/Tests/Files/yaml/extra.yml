# A flavor written in YAML, which can say why - JSON cannot carry a comment.
quiet:
  extends: plain              # defined in a JSON file in another directory
  description: The base, with the poll and its menu entry off
  components:
    disable: [com_poll]
  menu:
    items:
      community/poll: 0       # the navigation entry; the poll's own route is left alone
  modules:
    items:
      Latest Poll: 0          # every instance with that title
      92: 0                   # one instance, by id
