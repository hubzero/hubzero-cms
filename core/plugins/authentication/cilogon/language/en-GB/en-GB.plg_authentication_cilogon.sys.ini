PLG_AUTHENTICATION_CILOGON="Authentication - CILogon"
PLG_AUTHENTICATION_CILOGON_PARAM_AUTO_APPROVE_LABEL="Auto approve new users"
PLG_AUTHENTICATION_CILOGON_PARAM_AUTO_APPROVE_DESC="Automatically approve new users that register through this plugin.  This will override the setting in the users component concerning new user approval status."
PLG_AUTHENTICATION_CILOGON_PARAM_ALLOWED_IDPS_LABEL="Allowed identity providers"
PLG_AUTHENTICATION_CILOGON_PARAM_ALLOWED_IDPS_DESC="Restrict logins to specific CILogon identity providers. Enter one IdP entityID per line, e.g. https://idp.example.edu/idp/shibboleth. When a single IdP is listed it is pre-selected so CILogon skips its provider picker. Leave empty to allow any identity provider."
