PLG_MODERATION_STORY="Moderation - Story"

PLG_MODERATION_STORY_CREDITS_LABEL="Credits per grant"
PLG_MODERATION_STORY_CREDITS_DESC="How many moderations somebody can make from one handful."
PLG_MODERATION_STORY_LIFETIME_LABEL="Credits expire after (hours)"
PLG_MODERATION_STORY_LIFETIME_DESC="Unspent credits lapse. Moderation is meant to be done while the discussion is live, not hoarded."
PLG_MODERATION_STORY_INTERVAL_LABEL="Least time between grants (hours)"
PLG_MODERATION_STORY_INTERVAL_DESC="The minimum wait before the same person is offered credits again."
PLG_MODERATION_STORY_FRACTION_LABEL="Share of the pool granted"
PLG_MODERATION_STORY_FRACTION_DESC="What fraction of eligible readers are handed credits on each pass. Lower makes moderation rarer and more valued."
PLG_MODERATION_STORY_HITCOUNT_LABEL="Discussions read to qualify"
PLG_MODERATION_STORY_HITCOUNT_DESC="Moderation is offered to people who read. This is how many readings it takes to join the pool."
PLG_MODERATION_STORY_AGE_LABEL="Least account age (days)"
PLG_MODERATION_STORY_AGE_DESC="How long an account must have existed before it can be handed credits."
PLG_MODERATION_STORY_KARMA_LABEL="Least karma"
PLG_MODERATION_STORY_KARMA_DESC="The standing required to be offered credits at all."

PLG_MODERATION_STORY_REVIEW_LABEL="Review"
PLG_MODERATION_STORY_REVIEW_DESC="Whether moderators are themselves judged, and on what terms. Off unless the hub produces enough moderation to reach consensus."
PLG_MODERATION_STORY_REVIEW_ON_LABEL="Review moderations"
PLG_MODERATION_STORY_REVIEW_ON_DESC="Leave off on a quiet hub. A review system that cannot reach consensus leaves moderations unresolved forever and never populates the fairness record."
PLG_MODERATION_STORY_CONSENSUS_LABEL="Judgements to resolve one"
PLG_MODERATION_STORY_CONSENSUS_DESC="How many people must judge a moderation before it is settled."
PLG_MODERATION_STORY_REVIEW_KARMA_LABEL="Least karma to judge"
PLG_MODERATION_STORY_REVIEW_KARMA_DESC="The standing required before somebody is asked to judge others."
PLG_MODERATION_STORY_REVIEW_INTERVAL_LABEL="Least hours between batches"
PLG_MODERATION_STORY_REVIEW_INTERVAL_DESC="How long before the same person is handed another batch."
PLG_MODERATION_STORY_CONSEQUENCES_LABEL="Consequences"
PLG_MODERATION_STORY_CONSEQUENCES_DESC="One band per line, as fraction = moderator credits, moderator karma, credits to reviewers who agreed, credits to reviewers who did not. Leave empty for the defaults."

PLG_MODERATION_STORY_GRANTS_LABEL="How credits are handed out"
PLG_MODERATION_STORY_GRANTS_DESC="Which scheme decides who becomes a moderator, and how it is tuned."
PLG_MODERATION_STORY_GRANTOR_LABEL="Scheme"
PLG_MODERATION_STORY_GRANTOR_DESC="Interval is right for almost every hub. The token pool ties capacity to traffic instead of to your guess — better once there is traffic, and it issues nothing at all when there is not. Switch when the grants record says you are ready, not before."
PLG_MODERATION_STORY_GRANTOR_INTERVAL="On a timer, to a share of the eligible"
PLG_MODERATION_STORY_GRANTOR_TOKENPOOL="Token pool, following readership"
PLG_MODERATION_STORY_TPR_LABEL="Tokens per discussion read"
PLG_MODERATION_STORY_TPR_DESC="What one reading of a discussion mints. Token pool only."
PLG_MODERATION_STORY_TPC_LABEL="Tokens per credit"
PLG_MODERATION_STORY_TPC_DESC="A grant costs this times the credits per grant. Token pool only."
PLG_MODERATION_STORY_MTA_LABEL="Most tokens one person gains per pass"
PLG_MODERATION_STORY_MTA_DESC="Stops one heavy reader collecting the whole mint. Token pool only."
PLG_MODERATION_STORY_ETC_LABEL="Tokens lost per credit that expired"
PLG_MODERATION_STORY_ETC_DESC="What wasting a credit costs the pool. Without a cost there is no difference between spending a credit and sitting on it."
PLG_MODERATION_STORY_FACTOR_LABEL="Weight the pool by moderation record"
PLG_MODERATION_STORY_FACTOR_DESC="Ask well-regarded moderators more often and poorly-regarded ones less. Leave off until review has been running long enough to fill the fairness counters — switched on early it favours whoever happened to be judged first."
